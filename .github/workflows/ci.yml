name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Manifest and package versions agree
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "manifest=$MANIFEST package=$PACKAGE"
          test "$MANIFEST" = "$PACKAGE"

      - name: Build the extension zip
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Install Playwright
        run: npm i --no-save playwright

      # Permissions the extension does not actually need must not creep back in.
      - name: Permission surface
        run: npm run permissions

      # Contrast measured from rendered pixels, not from tokens: the banner
      # floats over an arbitrary page and the toolbar is translucent, so these
      # only resolve at paint time.
      - name: Contrast (WCAG AA)
        run: npm run contrast

      - name: Popup smoke test
        run: npm run smoke
