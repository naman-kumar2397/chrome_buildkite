name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Tag must match the manifest and package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PACKAGE"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::Tag $TAG does not match manifest ($MANIFEST) / package ($PACKAGE)."
            exit 1
          fi

      - name: Build the extension zip
        run: npm run pack

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Install from the Chrome Web Store, or download the zip below and load it unpacked
            from `chrome://extensions` with Developer mode on.

            See `CHANGELOG.md` for what changed.
